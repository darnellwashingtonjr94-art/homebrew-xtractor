name: Test Homebrew Formula

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-formula:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Audit Formula
        run: brew audit --type=formula ./Formula/sandb0x-xtract0r.rb || true

      - name: Install Formula
        run: brew install --build-from-source ./Formula/sandb0x-xtract0r.rb
